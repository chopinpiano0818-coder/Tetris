name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat

      - name: Install SDL2
        shell: pwsh
        run: |
          C:/vcpkg/vcpkg.exe install sdl2:x64-windows sdl2-ttf:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Create package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path dist/save

          Copy-Item build/bin/TetrisComplete.exe dist/

          Copy-Item C:/vcpkg/installed/x64-windows/bin/SDL2.dll dist/
          Copy-Item C:/vcpkg/installed/x64-windows/bin/SDL2_ttf.dll dist/

          Get-ChildItem C:/vcpkg/installed/x64-windows/bin/*.dll |
            ForEach-Object {
              Copy-Item $_.FullName dist/ -Force
            }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/* `
            -DestinationPath TetrisComplete-Windows-x64.zip `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TetrisComplete-Windows-x64
          path: TetrisComplete-Windows-x64.zip
